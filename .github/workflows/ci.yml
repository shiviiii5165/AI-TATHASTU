# Every push and PR to main: web app (types, lint, unit, E2E) and worker
# (unit) in parallel. Needs no secrets: the E2E runs against its own
# throwaway stack (e2e/support/stack.mts) and never reaches Neon, R2, the
# worker or OAuth; the worker tests use no DB or network.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, Vitest, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Disposable, for this job only. Pinned by digest.
    services:
      postgres:
        image: pgvector/pgvector@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ait_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ait_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x # package.json engines
          cache: npm

      - run: npm ci
      # Critical only for now: the known high advisories in nodemailer have no release
      # compatible with Auth.js's peer range (DEPLOYMENT.md, "Security follow-ups").
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Concurrency and migrations on real Postgres
        run: npm run test:pg
        env:
          TEST_POSTGRES_URL: postgresql://postgres:ci-only@127.0.0.1:5432/ait_test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (Phase 1–3 journey)
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  worker:
    name: Worker (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ait_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ait_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # matches worker/Dockerfile
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -r requirements.txt pytest==8.3.5 pip-audit==2.9.0
      - run: pip-audit -r requirements.txt
        continue-on-error: true # Reports only until the first run's findings are triaged.
      - name: Apply migrations to the disposable database
        run: |
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng postgresql-client
          for file in $(ls ../src/db/migrations/*.sql | sort); do
            psql "$QUEUE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"
          done
        env:
          QUEUE_TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/ait_test
      - run: pytest -q -rs
        env:
          QUEUE_TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/ait_test
